[project]
name = "projet-multimodal"
version = "0.1.0"
description = "RAG multimodal : OpenCLIP + ChromaDB + Nemotron / Gemma 4"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit",
    "pillow",
    "chromadb",
    "open-clip-torch",
    "langchain",
    "langchain-core",
    "langchain-openai",
    "langchain-google-genai",
    "python-dotenv",
    "ipykernel>=7.3.0",
]

[dependency-groups]
dev = ["ipykernel"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/projet_multimodal"]
